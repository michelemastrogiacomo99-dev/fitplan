<!doctype html>
<meta charset="utf-8">
<title>running…</title>
<pre id="out"></pre>
<script type="module">
import * as L from './logic.js';
import { DEFAULT_PROGRAM, DEFAULT_RECIPES, SUGGESTED_RECIPES } from './seed.js';
import { builtinPhoto } from './images.js';
import * as N from './nutrition.js';
import { youtubeId, exerciseVideo } from './videos.js';

const fails = []; let n = 0;
const ok = (cond, msg) => { n++; if (!cond) fails.push(msg); };
const eq = (a, b, msg) => ok(JSON.stringify(a) === JSON.stringify(b), `${msg}: got ${JSON.stringify(a)}, want ${JSON.stringify(b)}`);

// ---- dates ----
// 2026-10-05 is a Monday
eq(L.planningWeek(new Date(2026, 9, 5)), '2026-10-05', 'Mon plans this week');
eq(L.planningWeek(new Date(2026, 9, 8)), '2026-10-05', 'Thu plans this week');
eq(L.planningWeek(new Date(2026, 9, 9)), '2026-10-12', 'Fri plans next week');
eq(L.planningWeek(new Date(2026, 9, 10)), '2026-10-12', 'Sat plans next week');
eq(L.planningWeek(new Date(2026, 9, 11, 23, 59)), '2026-10-12', 'Sun night plans next week');
eq(L.planningWeek(new Date(2026, 11, 31)), '2026-12-28', 'Thu Dec 31 → Mon Dec 28');
eq(L.planningWeek(new Date(2027, 0, 1)), '2027-01-04', 'Fri Jan 1 → Mon Jan 4');
eq(L.shiftWeek('2026-10-26', 1), '2026-11-02', 'shift across DST end');
eq(L.shiftWeek('2027-03-08', 1), '2027-03-15', 'shift across DST start');
eq(L.shiftWeek('2026-12-28', 1), '2027-01-04', 'shift across the year');
eq(L.shiftWeek('2026-10-05', -1), '2026-09-28', 'shift back');
for (let i = 0; i < 800; i++) { // every day for two years: a Monday, 0–6 days back or 1–3 days ahead
  const d = new Date(2026, 0, 1 + i), w = L.fromIso(L.planningWeek(d));
  const diff = Math.round((w - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  ok(L.dow(w) === 0 && (L.dow(d) < 4 ? diff === -L.dow(d) : diff === 7 - L.dow(d)), `planningWeek ${L.iso(d)} → ${L.iso(w)}`);
  ok(L.iso(L.fromIso(L.iso(d))) === L.iso(d), `iso round trip ${L.iso(d)}`);
}
eq(L.dow(new Date(2026, 9, 4)), 6, 'Sunday is 6');

// ---- weights ----
eq(L.convWeight(100, 'kg', 'lb'), 220.5, 'kg → lb');
eq(L.convWeight(135, 'lb', 'kg'), 61, 'lb → kg');
eq(L.convWeight(135, 'lb', 'lb'), 135, 'same unit');
eq(L.convWeight(null, 'lb', 'kg'), null, 'null weight');
eq(L.convWeight(0, 'lb', 'kg'), 0, 'zero weight');

const e = { d: '2026-10-01', u: 'lb', sets: [{ w: 100, r: 10 }, { w: 110, r: 8 }, { w: null, r: null }, { w: 120, r: null }, { w: null, r: 12 }] };
const st = L.entryStats(e, 'lb');
eq([st.sets.length, st.top, st.reps, st.vol], [3, 110, 30, 1880], 'entryStats ignores sets without reps, bodyweight = 0');
eq(L.entryStats({ u: 'lb', sets: [] }, 'lb').top, 0, 'empty entry');
eq(L.entryStats({ u: 'kg', sets: [{ w: 100, r: 5 }] }, 'lb').top, 220.5, 'entryStats converts');

// ---- plan ----
const mk = (id, leftovers = false, type = 'main') => ({ id, name: id, type, leftovers, ingredients: [{ name: 'x', qty: 1, unit: 'g' }] });
const mains = p => p.flatMap(d => [d.l, d.d]);
const bf = [mk('b1', false, 'breakfast'), mk('b2', false, 'breakfast'), mk('b3', false, 'breakfast')];

{ // 14 plain dishes: each exactly once
  const rs = [...bf, ...Array.from({ length: 14 }, (_, i) => mk('m' + i))];
  const p = L.buildPlan(rs.filter(L.isMain).map(r => r.id), rs);
  eq(L.coverage(rs.map(r => r.id), rs), 14, 'coverage 14 (breakfasts ignored)');
  eq([...mains(p)].sort(), rs.filter(L.isMain).map(r => r.id).sort(), '14 dishes, 14 slots, once each');
  eq(p.map(d => d.b), ['b1', 'b2', 'b3', 'b1', 'b2', 'b3', 'b1'], 'breakfast rotation');
  ok(p.every(d => Object.keys(d.left).length === 0), 'no leftovers flags');
}
{ // leftovers: dinner then next-day lunch
  const rs = [mk('a', true), mk('b'), mk('c', true), mk('d')];
  eq(L.coverage(['a', 'b', 'c', 'd'], rs), 6, 'coverage counts leftovers twice');
  const p = L.buildPlan(['a', 'b', 'c', 'd'], rs);
  eq([p[0].d, p[1].l, p[1].left.l], ['a', 'a', true], 'first leftovers pair on Mon dinner → Tue lunch');
  eq([p[2].d, p[3].l, p[3].left.l], ['c', 'c', true], 'second pair on Wed dinner → Thu lunch');
  ok(mains(p).every(Boolean), 'no empty slot when dishes repeat');
  ok(p.every(d => d.b === null), 'no breakfast recipes → null');
}
eq(L.buildPlan([], [mk('a')]).flatMap(d => [d.l, d.d]).filter(Boolean), [], 'nothing picked → empty plan');
eq(L.buildPlan(['gone', 'b1', 'a', 'a'], [mk('a'), ...bf]).flatMap(d => [d.l, d.d]).every(x => x === 'a'), true, 'deleted, breakfast and duplicate picks are ignored');
eq(L.coverage(['gone', 'b1', 'a', 'a'], [mk('a'), ...bf]), 1, 'coverage ignores them too');
eq(L.coverage(undefined, []), 0, 'coverage of nothing');

// random plans: structural guarantees
let seed = 12345; // mulberry32: the same sequence on every run
const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
for (let t = 0; t < 3000; t++) {
  const k = 1 + Math.floor(rnd() * 20);
  const rs = [...bf, ...Array.from({ length: k }, (_, i) => mk('m' + i, rnd() < 0.35))];
  const liked = shuffle(rs.filter(L.isMain).map(r => r.id));
  const p = L.buildPlan(liked, rs), tag = `random plan #${t} (${k} dishes)`;
  ok(p.length === 7 && mains(p).every(Boolean), `${tag}: all 14 slots filled`);
  ok(mains(p).every(id => liked.includes(id)), `${tag}: only picked dishes`);
  for (let d = 0; d < 7; d++) {
    ok(!p[d].left.d && !p[d].left.b, `${tag}: only lunches are leftovers`);
    if (p[d].left.l) ok(d > 0 && p[d - 1].d === p[d].l, `${tag}: leftovers follow the dinner before`);
  }
  const cov = L.coverage(liked, rs), times = {};
  mains(p).forEach(id => { times[id] = (times[id] || 0) + 1; });
  if (cov >= 14) ok(Object.entries(times).every(([id, c]) => c === 1 || (c === 2 && rs.find(r => r.id === id).leftovers)), `${tag}: no dish repeated beyond its leftovers`);
  if (cov <= 14) ok(liked.every(id => times[id]), `${tag}: every picked dish is in the plan`);
  if (k >= 6) for (let d = 0; d < 7; d++) {
    ok(p[d].l !== p[d].d, `${tag}: different lunch and dinner`);
    if (d > 0) for (const m of ['l', 'd']) {
      const id = p[d][m], isPair = m === 'l' && p[d].left.l;
      if (!isPair) ok(p[d - 1].l !== id && p[d - 1].d !== id, `${tag}: ${id} on consecutive days (${d - 1}, ${d})`);
    }
  }
}

// ---- shopping ----
{
  const rs = [
    { id: 'a', type: 'main', ingredients: [{ name: 'Pasta', qty: 200, unit: 'g' }, { name: 'Eggs', qty: 2, unit: '' }, { name: 'Milk', qty: 500, unit: 'ml' }] },
    { id: 'b', type: 'main', ingredients: [{ name: ' pasta ', qty: 1, unit: 'kg' }, { name: 'Eggs', qty: 4, unit: '' }, { name: 'Beef', qty: 1, unit: 'lb' }, { name: 'Milk', qty: 1, unit: 'l' }, { name: 'Cheese', qty: 4, unit: 'slices' }, { name: 'Cheese', qty: 100, unit: 'g' }] },
    { id: 'c', type: 'breakfast', ingredients: [{ name: 'Oats', qty: 8, unit: 'oz' }, { name: '', qty: 5, unit: 'g' }, { name: 'Salt', qty: 'abc', unit: 'tsp' }] },
  ];
  const plan = [{ b: 'c', l: 'a', d: 'b', left: {} }, { b: null, l: 'b', d: 'gone', left: { l: true } }];
  const m = Object.fromEntries(L.shoppingItems(plan, rs, 'metric').map(i => [i.key, `${i.qty} ${i.unit}`.trim()]));
  eq(m, { 'beef|weight': '907 g', 'cheese|slices': '8 slices', 'cheese|weight': '200 g', 'eggs|': '10', 'milk|volume': '2.5 l', 'oats|weight': '227 g', 'pasta|weight': '2.2 kg', 'salt|tsp': '0 tsp' }, 'shopping metric');
  const u = Object.fromEntries(L.shoppingItems(plan, rs, 'us').map(i => [i.key, `${i.qty} ${i.unit}`.trim()]));
  eq([u['beef|weight'], u['oats|weight'], u['pasta|weight'], u['cheese|weight'], u['milk|volume']], ['2 lb', '8 oz', '4.9 lb', '7.1 oz', '2.5 l'], 'shopping US');
  eq(L.shoppingItems(plan, rs, 'us').map(i => i.key), L.shoppingItems(plan, rs, 'metric').map(i => i.key), 'same keys in both systems (ticks survive the switch)');
  eq(L.shoppingItems(null, rs), [], 'no plan → empty list');
  eq(L.shoppingItems([{ b: null, l: null, d: null }], rs), [], 'empty plan → empty list');
  const names = L.shoppingItems(plan, rs).map(i => i.name);
  eq(names, [...names].sort((a, b) => a.localeCompare(b)), 'sorted by name');
}

// ---- patches (shared documents) ----
{
  const { OP, applyPatch: ap } = L;
  eq(ap(null, { extra: OP.union([{ id: 'a', name: 'Milk' }]) }), { extra: [{ id: 'a', name: 'Milk' }] }, 'patch on a missing doc only creates its field');
  const week = { liked: ['a', 'b'], passed: ['c'], plan: [{ l: 'a' }], checked: ['x|1', 'pasta|weight'], extra: [{ id: '1', name: 'Milk' }] };
  const frozen = JSON.stringify(week);
  eq(ap(week, { checked: OP.union(['eggs|']) }).checked, ['x|1', 'pasta|weight', 'eggs|'], 'union adds');
  eq(ap(week, { checked: OP.union(['x|1', 'new', 'new']) }).checked, ['x|1', 'pasta|weight', 'new'], 'union adds once');
  eq(ap(week, { checked: OP.remove(['x|1', 'nope']) }).checked, ['pasta|weight'], 'remove');
  eq(ap(week, { extra: OP.remove([{ name: 'Milk', id: '1' }]) }).extra, [], 'remove an object whatever its key order');
  eq(ap(week, { liked: [], passed: [] }).plan, [{ l: 'a' }], 'other fields untouched');
  eq(ap(week, { plan: [{ l: 'b' }] }).plan, [{ l: 'b' }], 'arrays replace');
  eq(JSON.stringify(week), frozen, 'the original document is not mutated');
  // two phones: each ticks a different item starting from the same state
  const a = OP.union(['A']), b = OP.union(['B']);
  eq(ap(ap(week, { checked: a }), { checked: b }).checked.slice(-2), ['A', 'B'], 'two ticks from two phones both survive');
  const diet = { mealsPerWeek: 14, recipes: { r1: { id: 'r1', name: 'One', o: 0 }, r2: { id: 'r2', name: 'Two', o: 1 } } };
  eq(Object.keys(ap(diet, { recipes: { r3: { id: 'r3', name: 'Three', o: 2 } } }).recipes), ['r1', 'r2', 'r3'], 'adding a recipe keeps the others');
  eq(Object.keys(ap(diet, { recipes: { r1: OP.del } }).recipes), ['r2'], 'deleting a recipe keeps the others');
  eq(ap(diet, { mealsPerWeek: 10 }).recipes, diet.recipes, 'changing a setting keeps the recipes');
  eq(ap(diet, { recipes: { r1: { id: 'r1', name: 'Uno', o: 0 } } }).recipes.r1.name, 'Uno', 'editing a recipe');
}

// ---- seed data ----
{
  eq(DEFAULT_PROGRAM.length, 7, 'program has 7 days');
  const ids = DEFAULT_PROGRAM.flatMap(d => d.exercises.map(x => x.id));
  eq(new Set(ids).size, ids.length, 'exercise ids are unique');
  ok(DEFAULT_PROGRAM.every(d => typeof d.title === 'string' && d.exercises.every(x => x.name && x.sets >= 1 && x.reps && typeof x.note === 'string')), 'exercises are complete');
  eq(DEFAULT_PROGRAM.map(d => d.exercises.length), [5, 6, 4, 5, 4, 5, 0], 'exercises per day match the plan');
  const rids = DEFAULT_RECIPES.map(r => r.id);
  eq(new Set(rids).size, rids.length, 'recipe ids are unique');
  ok(DEFAULT_RECIPES.every(r => r.name && ['main', 'breakfast'].includes(r.type) && r.ingredients.length && r.ingredients.every(i => i.name && i.qty > 0 && L.UNITS.includes(i.unit))), 'recipes are complete, units known');
  ok(DEFAULT_RECIPES.filter(L.isMain).length >= 14, 'at least 14 lunch/dinner dishes');
  ok(JSON.stringify(DEFAULT_RECIPES).indexOf('undefined') < 0 && JSON.stringify(DEFAULT_PROGRAM) === JSON.stringify(JSON.parse(JSON.stringify(DEFAULT_PROGRAM))), 'seed is plain JSON');
  const p = L.buildPlan(DEFAULT_RECIPES.filter(L.isMain).map(r => r.id), DEFAULT_RECIPES);
  ok(p.flatMap(d => [d.b, d.l, d.d]).every(Boolean), 'default recipes fill a whole week');
  ok(L.shoppingItems(p, DEFAULT_RECIPES).every(i => i.qty > 0), 'default week → positive quantities');
  const all = [...DEFAULT_RECIPES, ...SUGGESTED_RECIPES], allIds = all.map(r => r.id);
  eq(new Set(allIds).size, allIds.length, 'suggested recipe ids do not clash with the default ones');
  ok(SUGGESTED_RECIPES.every(r => r.name && ['main', 'breakfast'].includes(r.type) && r.ingredients.length && r.ingredients.every(i => i.name && i.qty > 0 && L.UNITS.includes(i.unit))), 'suggested recipes are complete, units known');
  eq(all.filter(r => !/^https:\/\/images\.unsplash\.com\/photo-[\w-]+\?/.test(builtinPhoto(r.id, 'card'))).map(r => r.id), [], 'every built-in dish has a photo');
  eq(builtinPhoto('made-by-user'), '', 'no built-in photo for a user recipe');
}

// ---- nutrition ----
{
  const one = (name, qty, unit) => N.estimate({ ingredients: [{ name, qty, unit }] }, 1);
  eq(one('Pasta', 100, 'g').kcal, 371, '100 g pasta');
  eq(one('Eggs', 2, '').kcal, 143, '2 eggs = 100 g');
  eq(one('eggs', 2, '').kcal, 143, 'case does not matter');
  eq(one('Egg', 2, '').kcal, 143, 'singular');
  eq(one('Chicken breast', 1, 'lb').kcal, 544, 'pounds');
  eq(one('Olive oil', 1, 'tbsp').kcal, 119, 'a tablespoon of oil');
  eq(one('Milk', 0.5, 'l').kcal, 250, 'litres');
  eq(one('Grilled chicken breast', 200, 'g').p, 45, 'a food named inside a longer name');
  eq(one('Unicorn meat', 200, 'g').missing, ['Unicorn meat'], 'unknown food is reported, not guessed');
  eq(one('Pasta', 2, 'bunch').missing, ['Pasta'], 'a unit that cannot be weighed for that food is reported');
  eq(one('Pasta', 'abc', 'g').kcal, 0, 'garbage quantity counts as zero');
  eq(N.estimate({ ingredients: [{ name: 'Pasta', qty: 200, unit: 'g' }] }).kcal, 371, 'a recipe for two → one person gets half');
  eq(N.estimate(null).kcal, 0, 'no recipe');
  const manual = N.nutrition({ kcal: 600, p: 40, c: 50, f: 20, ingredients: [{ name: 'Pasta', qty: 200, unit: 'g' }] });
  eq([manual.kcal, manual.p, manual.manual], [600, 40, true], 'typed calories win over the estimate');
  eq(N.nutrition({ kcal: 0, ingredients: [{ name: 'Pasta', qty: 200, unit: 'g' }] }).kcal, 371, 'kcal 0 = estimate');
  eq(N.nutrition(undefined), null, 'nutrition of nothing');
  const all = [...DEFAULT_RECIPES, ...SUGGESTED_RECIPES], table = all.map(r => [r.id, N.estimate(r)]);
  eq(table.filter(([, n]) => !n.complete).map(([id, n]) => id + ': ' + n.missing.join('/')), [], 'every ingredient of every built-in recipe is counted');
  eq(table.filter(([, n]) => n.kcal < 180 || n.kcal > 1300).map(([id, n]) => id + ' ' + n.kcal), [], 'built-in recipes land in a believable range per person');
  ok(table.every(([, n]) => Math.abs(n.p * 4 + n.c * 4 + n.f * 9 - n.kcal) < n.kcal * 0.2 + 30), 'macros add up to the calories (±20%)');
  window.__nutri = table.map(([id, n]) => `${id}: ${n.kcal} kcal P${n.p} C${n.c} F${n.f}`);
  // diary
  const day = { m: { b: { kcal: 300, p: 20, c: 30, f: 10 }, d: { kcal: 700, p: 40, c: 80, f: 20 } }, x: [{ kcal: 150 }, { kcal: 'x' }], burned: 400 };
  eq(N.dayTotals(day, 2000), { kcal: 1150, p: 60, c: 110, f: 30, burned: 400, target: 2000, left: 1250, any: true }, 'day: eaten, burned, left');
  eq(N.dayTotals({ m: { b: { kcal: 2500 } } }, 2000).left, -500, 'over target is negative');
  eq(N.dayTotals(undefined, 2000), { kcal: 0, p: 0, c: 0, f: 0, burned: 0, target: 2000, left: 2000, any: false }, 'empty day');
  eq(L.weekOf('2026-10-05'), '2026-10-05', 'weekOf a Monday'); eq(L.weekOf('2026-10-11'), '2026-10-05', 'weekOf a Sunday');
  eq(L.weekOf('2027-01-01'), '2026-12-28', 'weekOf across the year'); eq(L.shiftDay('2026-10-31', 1), '2026-11-01', 'shiftDay across DST and month');
  eq(L.shiftDay('2026-03-01', -1), '2026-02-28', 'shiftDay back');
}
// ---- eating out ----
{
  const rs = [...bf, ...Array.from({ length: 14 }, (_, i) => mk('m' + i, i < 3))];
  const liked = rs.filter(L.isMain).map(r => r.id);
  const keep = L.blankPlan(); keep[1].l = L.OUT; keep[4].d = L.OUT; keep[6].b = L.OUT; keep[0].d = 'old-dish';
  eq([L.outCount(keep), L.needed(14, keep), L.needed(10, keep), L.needed(14, null), L.needed(14, undefined)], [2, 12, 10, 14, 14], 'eating out lowers the dishes to pick');
  const p = L.buildPlan(liked, rs, keep);
  eq([p[1].l, p[4].d, p[6].b], [L.OUT, L.OUT, L.OUT], 'meals eaten out stay where they were');
  ok(p[0].d !== 'old-dish' && mains(p).filter(x => x !== L.OUT).every(id => liked.includes(id)) && mains(p).every(Boolean), 'the rest is rebuilt from the picked dishes');
  ok(p.every((d, i) => !d.left.l || (d.l !== L.OUT && p[i - 1].d === d.l)), 'leftovers never land on a meal eaten out');
  eq(L.shoppingItems(p, rs).length, 1, 'shopping ignores meals eaten out');
  eq(L.shoppingItems([{ b: L.OUT, l: L.OUT, d: L.OUT }], rs), [], 'a day fully out buys nothing');
  const all = L.blankPlan().map(() => ({ b: null, l: L.OUT, d: L.OUT, left: {} }));
  eq([L.needed(14, all), mains(L.buildPlan(liked, rs, all)).every(x => x === L.OUT)], [0, true], 'a whole week out needs no dishes');
  for (let t = 0; t < 500; t++) { // random outs + random picks keep every guarantee
    const k = 1 + Math.floor(rnd() * 16), rr = [...bf, ...Array.from({ length: k }, (_, i) => mk('m' + i, rnd() < 0.4))];
    const fixed = L.blankPlan(); fixed.forEach(d => { if (rnd() < 0.25) d.l = L.OUT; if (rnd() < 0.25) d.d = L.OUT; });
    const lk = shuffle(rr.filter(L.isMain).map(r => r.id)), q = L.buildPlan(lk, rr, fixed);
    ok(q.every((d, i) => (fixed[i].l === L.OUT) === (d.l === L.OUT) && (fixed[i].d === L.OUT) === (d.d === L.OUT) && d.l && d.d), `random outs #${t}: outs kept, nothing empty`);
    ok(q.every((d, i) => !d.left.l || (i > 0 && q[i - 1].d === d.l && d.l !== L.OUT)), `random outs #${t}: leftovers follow their dinner`);
  }
}
// ---- numbers handed over by the Health shortcut ----
eq(['523', '523.6', '523,6', '523 kcal', '523,6 kcal', '1,234', '1.234', '1 234', '1.234,5', '1,234.56', '12,345', '0', '87.4 Cal', ' 640 '].map(L.parseAmount),
  [523, 524, 524, 523, 524, 1234, 1234, 1234, 1235, 1235, 12345, 0, 87, 640], 'calories in any usual spelling');
eq(['', 'kcal', 'abc', null, undefined, 'Rounded Number', '-'].map(L.parseAmount), [null, null, null, null, null, null, null], 'no number → nothing');
// ---- meals out of proportion ----
eq([N.mealFlag(900, false, 2000), N.mealFlag(901, false, 2000), N.mealFlag(1206, false, 2000), N.mealFlag(600, true, 2000), N.mealFlag(601, true, 2000), N.mealFlag(1206, false, 3000), N.mealFlag(0, false, 2000), N.mealFlag(1000, false, 0), N.mealFlag('x', false)],
  [null, { share: 45 }, { share: 60 }, null, { share: 30 }, null, null, { share: 50 }, null], 'lunch/dinner above 45% of the day, breakfast above 30%');
eq(N.topSources(DEFAULT_RECIPES.find(r => r.id === 'm-baked-bolognese')).map(t => t.name), ['Ground beef', 'Pasta'], 'what makes a recipe heavy');
eq(N.topSources({ ingredients: [{ name: 'Unicorn', qty: 1, unit: 'kg' }] }), [], 'unknown food is not a source');
// ---- workout and history ----
{
  eq([N.workoutKcal(60, 80, 'moderate'), N.workoutKcal(60, 80, 'light'), N.workoutKcal(45, 60, 'hard'), N.workoutKcal(60, undefined, 'moderate'), N.workoutKcal(0, 80), N.workoutKcal('x', 80), N.workoutKcal(900, 80, 'moderate'), N.workoutKcal(60, 80, 'nonsense')],
    [320, 200, 225, 300, 0, 0, 1600, 320], 'workout estimate: (MET − 1) × kg × hours, capped at 5 h');
  eq([N.burnedOf({ burned: 300 }), N.burnedOf({ burned: 300, w: { kcal: 320, tracked: true } }), N.burnedOf({ burned: 300, w: { kcal: 320, tracked: false } }), N.burnedOf({ w: { kcal: 320 } }), N.burnedOf(undefined)],
    [300, 300, 620, 320, 0], 'a workout the watch recorded is not added twice');
  eq(N.dayTotals({ m: { b: { kcal: 500 } }, burned: 200, w: { kcal: 300, tracked: false } }, 2000).left, 2000, 'diary counts the workout estimate');
  const days = {
    '2026-10-03': { m: { l: { kcal: 1800 } }, burned: 400 },
    '2026-10-04': { burned: 250 },                                         // nothing eaten logged: unknown
    '2026-10-05': { m: { b: { kcal: 600 }, d: { kcal: 2200 } }, x: [{ kcal: 200 }], w: { kcal: 320, tracked: false, min: 60 } },
  };
  const h = N.calorieHistory(days, 2500, 4, '2026-10-05');
  eq(h.rows.map(r => r.d), ['2026-10-02', '2026-10-03', '2026-10-04', '2026-10-05'], 'history: last n days, oldest first');
  eq(h.rows.map(r => r.deficit), [null, 1100, null, -180], 'deficit = maintenance + burned − eaten; no food logged = unknown');
  eq([h.logged, h.total, h.avg, h.burnedTotal, h.workouts], [2, 920, 460, 970, 1], 'history totals');
  eq(N.calorieHistory({}, 2000, 7, '2026-03-02').rows.map(r => r.d)[0], '2026-02-24', 'history crosses months');
  eq([N.calorieHistory(null, 2000, 3, '2026-10-05').logged, N.calorieHistory(undefined, 2000, 3, '2026-10-05').avg], [0, 0], 'no diary yet');
}
// ---- body weight ----
eq([N.parseWeight('80', 'kg'), N.parseWeight('176.4', 'lb'), N.parseWeight('176,4 lb', 'kg'), N.parseWeight('80 kg', 'lb'), N.parseWeight('80.25 kilograms', 'lb'), N.parseWeight('165 pounds', 'kg'), N.parseWeight(' 72,5 ', 'kg')],
  [80, 80, 80, 80, 80.3, 74.8, 72.5], 'weights in kg, whatever the unit and the spelling');
eq([N.parseWeight('', 'kg'), N.parseWeight('abc', 'kg'), N.parseWeight('5', 'kg'), N.parseWeight('900', 'lb'), N.parseWeight(null, 'kg'), N.parseWeight('Weight', 'lb')], [null, null, null, null, null, null], 'not a believable weight → nothing');
eq(N.weightSeries({ '2026-10-05': { kg: 80.2 }, '2026-10-01': { kg: 81, burned: 3 }, '2026-10-03': { burned: 200 }, '2026-10-04': { kg: 0 } }), [{ d: '2026-10-01', kg: 81 }, { d: '2026-10-05', kg: 80.2 }], 'weigh-ins oldest first, only days with a weight');
eq([N.weightSeries(null), N.weightSeries({})], [[], []], 'no weigh-ins');
// ---- suggested calories ----
{
  const man = { sex: 'm', age: 30, heightCm: 180, weightKg: 80, activity: 'moderate', goal: 'keep' };
  eq(N.suggestCalories(man), { bmr: 1780, maintain: 2760, target: 2760, protein: 145, floored: false }, 'man 30y 180cm 80kg, moderate, keep');
  eq(N.suggestCalories({ ...man, goal: 'lose2' }).target, 2260, 'lose: 500 less');
  eq(N.suggestCalories({ ...man, goal: 'gain1' }).target, 3010, 'gain slowly: 250 more');
  const woman = { sex: 'f', age: 28, heightCm: 165, weightKg: 60, activity: 'sedentary', goal: 'lose2' };
  eq([N.suggestCalories(woman).bmr, N.suggestCalories(woman).maintain, N.suggestCalories(woman).target, N.suggestCalories(woman).floored], [1330, 1600, 1200, true], 'woman: never below 1200');
  eq(N.suggestCalories({ ...man, activity: undefined, goal: undefined }).maintain, 2450, 'activity defaults to light, goal to keep');
  eq([N.suggestCalories(null), N.suggestCalories({}), N.suggestCalories({ ...man, sex: '' }), N.suggestCalories({ ...man, age: 5 }), N.suggestCalories({ ...man, heightCm: 18 }), N.suggestCalories({ ...man, weightKg: 0 }), N.suggestCalories({ ...man, weightKg: 'abc' })],
    [null, null, null, null, null, null, null], 'no suggestion until the answers make sense');
  ok(Math.abs(180 / N.IN / 12 - 5.905) < 0.01 && Math.abs(80 * N.LB - 176.4) < 0.1, 'unit constants');
}
// ---- videos ----
{
  eq(youtubeId('https://www.youtube.com/watch?v=rrJIyZGlK8c'), 'rrJIyZGlK8c', 'watch link');
  eq(youtubeId('https://www.youtube.com/watch?feature=share&v=rrJIyZGlK8c&t=3'), 'rrJIyZGlK8c', 'watch link with other parameters');
  eq(youtubeId('https://youtu.be/rrJIyZGlK8c?si=abc'), 'rrJIyZGlK8c', 'short link');
  eq(youtubeId('youtube.com/shorts/rrJIyZGlK8c'), 'rrJIyZGlK8c', 'shorts link');
  eq(youtubeId('https://m.youtube.com/embed/rrJIyZGlK8c'), 'rrJIyZGlK8c', 'embed link');
  eq([youtubeId(''), youtubeId(undefined), youtubeId('hello'), youtubeId('https://vimeo.com/123'), youtubeId('javascript:alert(1)')], ['', '', '', '', ''], 'anything else gives no video');
  const exs = DEFAULT_PROGRAM.flatMap(d => d.exercises);
  eq(exs.filter(e => !/^[\w-]{11}$/.test(exerciseVideo(e))).map(e => e.id), [], 'every default exercise has a video');
  eq(exerciseVideo({ id: 'bench', video: 'https://youtu.be/aaaaaaaaaaa' }), 'aaaaaaaaaaa', 'an exercise\'s own link wins');
  eq(exerciseVideo({ id: 'my-own' }), '', 'no video for an unknown exercise');
}

document.title = fails.length ? `FAIL ${fails.length}/${n}` : `PASS ${n}`;
document.getElementById('out').textContent = document.title + '\n' + fails.slice(0, 40).join('\n');
